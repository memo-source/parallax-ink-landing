  <button onclick="exportPNG('slide-04.png')">&#x2B07; Descargar PNG</button>
  <span id="st"></span>
  <script>
    function exportPNG(filename) {
      const st = document.getElementById('st');
      st.textContent = 'Generando…';
      const svg = document.getElementById('theSVG');
      const W = 1080, H = 1350;
      const str = new XMLSerializer().serializeToString(svg);
      const blob = new Blob([str], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const img = new Image();
      img.onload = () => {
        const c = document.createElement('canvas');
        c.width = W; c.height = H;
        c.getContext('2d').drawImage(img, 0, 0, W, H);
        URL.revokeObjectURL(url);
        const a = document.createElement('a');
        a.download = filename; a.href = c.toDataURL('image/png'); a.click();
        st.textContent = '✓ Descargado.';
      };
      img.onerror = e => { st.textContent = 'Error: ' + e; };
      img.src = url;
    }
  </script>
