  <script>
    function exportPNG() {
      const status = document.getElementById('status');
      status.textContent = 'Generando PNG...';

      const svg = document.getElementById('theSVG');
      const W = 1080, H = 1350;

      // Serialize the inline SVG to a string
      const serializer = new XMLSerializer();
      let svgStr = serializer.serializeToString(svg);

      // Ensure correct dimensions in the serialized string
      svgStr = svgStr.replace(/width="\d+"/, `width="${W}"`).replace(/height="\d+"/, `height="${H}"`);

      // Build a Blob URL — avoids any cross-origin tainted-canvas issue
      const blob = new Blob([svgStr], { type: 'image/svg+xml;charset=utf-8' });
      const url  = URL.createObjectURL(blob);

      const img = new Image();
      img.onload = function () {
        const canvas = document.createElement('canvas');
        canvas.width  = W;
        canvas.height = H;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, W, H);
        URL.revokeObjectURL(url);

        try {
          const dataURL = canvas.toDataURL('image/png');
          const link = document.createElement('a');
          link.download = 'dev-costs-banner.png';
          link.href = dataURL;
          link.click();
          status.textContent = '✓ Descargado correctamente.';
        } catch (e) {
          status.textContent = 'Error al exportar: ' + e.message;
          console.error(e);
        }
      };
      img.onerror = function (e) {
        status.textContent = 'Error al cargar la imagen SVG.';
        console.error(e);
      };
      img.src = url;
    }
  </script>
